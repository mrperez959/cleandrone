<?xml version="1.0" encoding="UTF-8"?>
<!--
  Driveway Site Plan — Drawing Only (no text labels)
  Property: 8506 Seven Coves Ct, Tampa FL 33634
  Coordinate units = feet. viewBox 0 0 110 78.
  Open in Inkscape / Illustrator / Figma to add labels.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 110 78"
     preserveAspectRatio="xMidYMid meet"
     width="2200" height="1560">

  <style>
    .property-line { stroke: #1a2332; stroke-width: 0.45; fill: none; }
    .eop-line { stroke: #222; stroke-width: 0.32; fill: none; }
    .cl-line { stroke: #555; stroke-width: 0.22; fill: none; stroke-dasharray: 1.8 0.9 0.4 0.9; }
    .easement-line { stroke: #a0533c; stroke-width: 0.18; fill: none; stroke-dasharray: 0.5 0.5; }
    .dim-line { stroke: #0a3d62; stroke-width: 0.16; fill: none; }
    .dim-tick { stroke: #0a3d62; stroke-width: 0.22; }
    .neighbor-fill { fill: #c8c8c8; stroke: #777; stroke-width: 0.25; stroke-dasharray: 0.9 0.6; }
  </style>

  <!-- White page background -->
  <rect x="0" y="0" width="110" height="78" fill="#ffffff" />

  <!-- ZONE FILLS -->
  <rect x="0"  y="6"  width="110" height="16" fill="#e8f1fa" />
  <rect x="17" y="22" width="59"  height="5"  fill="#fadcdc" />
  <rect x="0"  y="27" width="110" height="13" fill="#f4ecc8" />
  <rect x="0"  y="40" width="110" height="14" fill="#bcbcbc" />

  <!-- DRIVEWAYS -->
  <rect x="22" y="6" width="17" height="34" fill="#7da6c9" stroke="#234e70" stroke-width="0.18" />
  <rect x="49" y="6" width="10" height="34" fill="#7da6c9" stroke="#234e70" stroke-width="0.18" />

  <!-- NEIGHBOR DRIVEWAY (schematic, dashed) -->
  <rect class="neighbor-fill" x="0" y="27" width="12" height="13" />

  <!-- KEY LINES -->
  <line class="property-line" x1="17" y1="27" x2="76" y2="27" />
  <path class="property-line" d="M 76 27 A 14 14 0 0 1 76 55" />
  <line class="property-line" x1="17" y1="6" x2="17" y2="27" stroke-dasharray="0.7 0.7" />
  <line class="property-line" x1="90" y1="41" x2="110" y2="41" stroke-dasharray="0.7 0.7" />
  <line class="easement-line" x1="17" y1="22" x2="76" y2="22" />
  <line class="eop-line" x1="0" y1="40" x2="110" y2="40" />
  <line class="cl-line"  x1="0" y1="52" x2="110" y2="52" />

  <!-- UTILITY SYMBOLS -->
  <circle cx="19" cy="33" r="0.6" fill="#fff" stroke="#1a4d80" stroke-width="0.3" />
  <rect x="61" y="32" width="1.5" height="1.5" fill="#fff" stroke="#7a4c00" stroke-width="0.3" />

  <!-- 3 ft clearance brackets -->
  <line class="dim-line" x1="19.5" y1="36" x2="22"   y2="36" />
  <line class="dim-tick" x1="19.5" y1="35.4" x2="19.5" y2="36.6" />
  <line class="dim-tick" x1="22"   y1="35.4" x2="22"   y2="36.6" />
  <line class="dim-line" x1="59"   y1="36" x2="61"   y2="36" />
  <line class="dim-tick" x1="59"   y1="35.4" x2="59"   y2="36.6" />
  <line class="dim-tick" x1="61"   y1="35.4" x2="61"   y2="36.6" />

  <!-- TOP DIM (frontage 59 ft) -->
  <line class="dim-line" x1="17" y1="3" x2="76" y2="3" />
  <line class="dim-tick" x1="17" y1="1.4" x2="17" y2="4.6" />
  <line class="dim-tick" x1="76" y1="1.4" x2="76" y2="4.6" />

  <!-- BOTTOM DIM A (chain 5/17/10/10/17) -->
  <line class="dim-line" x1="17" y1="60" x2="76" y2="60" />
  <line class="dim-tick" x1="17" y1="59" x2="17" y2="61" />
  <line class="dim-tick" x1="22" y1="59" x2="22" y2="61" />
  <line class="dim-tick" x1="39" y1="59" x2="39" y2="61" />
  <line class="dim-tick" x1="49" y1="59" x2="49" y2="61" />
  <line class="dim-tick" x1="59" y1="59" x2="59" y2="61" />
  <line class="dim-tick" x1="76" y1="59" x2="76" y2="61" />

  <!-- BOTTOM DIM B (neighbor 10 ft) -->
  <line class="dim-line" x1="12" y1="67" x2="22" y2="67" />
  <line class="dim-tick" x1="12" y1="66" x2="12" y2="68" />
  <line class="dim-tick" x1="22" y1="66" x2="22" y2="68" />

  <!-- RIGHT DIM (vertical) -->
  <line class="dim-line" x1="98" y1="22" x2="98" y2="27" />
  <line class="dim-tick" x1="97" y1="22" x2="99" y2="22" />
  <line class="dim-tick" x1="97" y1="27" x2="99" y2="27" />

  <line class="dim-line" x1="98" y1="27" x2="98" y2="40" />
  <line class="dim-tick" x1="97" y1="40" x2="99" y2="40" />

  <line class="dim-line" x1="98" y1="40" x2="98" y2="52" />
  <line class="dim-tick" x1="97" y1="52" x2="99" y2="52" />

  <line class="dim-line" x1="106" y1="27" x2="106" y2="52" />
  <line class="dim-tick" x1="105" y1="27" x2="107" y2="27" />
  <line class="dim-tick" x1="105" y1="52" x2="107" y2="52" />

  <!-- North arrow -->
  <g transform="translate(6, 75)">
    <circle cx="0" cy="0" r="3" fill="#fff" stroke="#1a2332" stroke-width="0.18" />
    <polygon points="0,-2.4 0.6,0.8 0,0.3 -0.6,0.8" fill="#1a2332" />
  </g>

</svg>
